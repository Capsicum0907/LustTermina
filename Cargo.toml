[package]
name = "lust_termina"
version = "0.3.0"
edition = "2024"
description = "A terminal emulator for Windows, built with Rust + egui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Capsicum0907/LustTermina"
readme = "README.md"

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.35.0"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Controls", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1.31"

# Release builds: strip symbols to shrink the binary and drop debug info.
# To also scrub local build paths (e.g. the home directory) from the binary,
# build with RUSTFLAGS="--remap-path-prefix=<home>=<placeholder>".
[profile.release]
strip = true
